<!doctype html><n<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7f0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ガチャSTOP!"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>ガチャSTOP!</title>
<style>
:root{--ink:#332d39;--pink:#ff719b;--cream:#fff7f0}*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:radial-gradient(circle at 10% 5%,#ffe0e9 0 12%,transparent 32%),radial-gradient(circle at 95% 20%,#ffe8c8 0 10%,transparent 30%),var(--cream);font-family:system-ui,sans-serif;color:var(--ink)}main{max-width:520px;margin:auto}header{text-align:center;margin:8px 0 22px}.tag{display:inline-block;background:white;border:2px solid var(--ink);border-radius:30px;padding:6px 13px;font-size:12px;font-weight:900}h1{font-size:44px;margin:14px 0 6px}h1 span{color:var(--pink);text-shadow:2px 2px var(--ink)}.subtitle{text-align:center;font-size:13px;color:#766d7a}.card{background:white;border:2px solid var(--ink);border-radius:25px;padding:22px;box-shadow:6px 7px var(--ink);margin:18px 0}.label{font-size:12px;font-weight:900;letter-spacing:.1em;color:#8b7d8e;text-align:center}.month{text-align:center;font-size:13px;font-weight:900;margin:8px}.total{display:flex;justify-content:center;align-items:baseline;gap:5px}.total strong{font-size:64px;letter-spacing:-.06em}.total small{font-size:20px;font-weight:900}.note{text-align:center;font-size:12px;color:#8b7d8e}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:15px;font-weight:900}.add{padding:14px 3px;background:#ffe0eb;box-shadow:0 4px var(--ink);font-size:17px}.add:nth-child(2){background:#ffe9c9}.add:nth-child(3){background:#e9e2ff}button:active{transform:translateY(3px);box-shadow:0 1px var(--ink)}.result{background:#fff4d9;text-align:center;min-height:205px;display:flex;flex-direction:column;align-items:center;justify-content:center}.emoji{font-size:66px}.result h2{font-size:21px;margin:8px 0 5px}.result p{font-size:14px;line-height:1.6;margin:0}.progresswrap{height:12px;background:#f1edf2;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;margin:16px 0 6px}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--pink),#ffb35c)}.next{text-align:center;font-size:11px;color:#817584}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}.share,.reset{background:#f1eaff;padding:10px 16px;border-radius:999px;font-size:12px}.reset{background:white;border-color:#b9aebc;color:#766d7a}.footer{text-align:center;font-size:11px;color:#958b98;line-height:1.7;margin:22px 0}
</style></head><body><main><header><div class="tag">CAPSULE TOY BUDGET CHECK</div><h1>ガチャ<span>STOP!</span> 🎀</h1><p class="subtitle">回す前に、ちょっとだけ現実チェック。</p></header>
<section class="card"><div class="label">THIS MONTH'S GACHA TOTAL</div><div class="month" id="month"></div><div class="total"><strong id="total">0</strong><small>円</small></div><p class="note">今月いくら使った？ボタンで記録しよう</p><div class="buttons"><button class="add" data-add="300">＋300円</button><button class="add" data-add="400">＋400円</button><button class="add" data-add="500">＋500円</button></div></section>
<section class="card result" aria-live="polite"><div class="label">YOUR MONEY, YOUR VALUE</div><div class="emoji" id="emoji">🐣</div><h2 id="headline">まずは気軽に記録！</h2><p id="message">ガチャを回す前に、使った金額をここに足してみよう。</p></section>
<section class="card"><div style="display:flex;justify-content:space-between"><span class="label">つぎのチェックポイント</span><b id="nextLabel">1,000円</b></div><div class="progresswrap"><div class="progress" id="progress"></div></div><div class="next" id="nextText">あと1,000円でラーメン1杯分！</div><div class="actions"><button class="share" id="share">↗ 友達にシェア</button><button class="reset" id="reset">↺ 今月の金額をリセット</button></div></section>
<p class="footer">※ 毎月1日に自動で新しい月の記録に切り替わります。<br>記録はこの端末・ブラウザ内に保存され、友達とは共有されません。</p></main>
<script>
const now=new Date(), ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'), key='gachaStopTotal_'+ym;
let total=Number(localStorage.getItem(key)||0);
const levels=[{v:1000,e:'🍜',n:'ラーメン1杯分',w:'その金額でラーメンが1杯食べられる！次の1回、本当に欲しい？'},{v:3000,e:'👗',n:'服1着分',w:'服1着分に到達！ガチャの景品、服より欲しいか考えてみよう。'},{v:5000,e:'🥩',n:'焼肉食べ放題1回分',w:'焼肉食べ放題1回分！ここまで来たら、今日は一旦ストップもアリ。'}];
const $=id=>document.getElementById(id);$('month').textContent=(now.getMonth()+1)+'月の記録';
function render(){ $('total').textContent=total.toLocaleString('ja-JP');let cur=[...levels].reverse().find(x=>total>=x.v);$('emoji').textContent=cur?cur.e:(total?'🪙':'🐣');$('headline').textContent=cur?cur.v.toLocaleString('ja-JP')+'円＝'+cur.n:(total?'ちょっとずつ積み重なってる…！':'まずは気軽に記録！');$('message').textContent=cur?cur.w:(total?'まだ小さく見えても、合計すると意外な金額になるよ。':'ガチャを回す前に、使った金額をここに足してみよう。');let next=levels.find(x=>total<x.v);if(next){let i=levels.indexOf(next),prev=i?levels[i-1].v:0;$('nextLabel').textContent=next.v.toLocaleString('ja-JP')+'円';$('progress').style.width=Math.max(0,Math.min(100,(total-prev)/(next.v-prev)*100))+'%';$('nextText').textContent='あと'+(next.v-total).toLocaleString('ja-JP')+'円で'+next.n+'！';}else{$('nextLabel').textContent='5,000円達成！';$('progress').style.width='100%';$('nextText').textContent='大きな節目！ここで一度、使い方を見直してみよう。';}localStorage.setItem(key,String(total));}
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{total+=Number(b.dataset.add);render()}));
$('reset').addEventListener('click',()=>{if(total&&confirm('今月の累計金額を0円に戻す？')){total=0;render()}});
$('share').addEventListener('click',async()=>{if(!/^https?:$/.test(location.protocol)){alert('公開後のURLでこのボタンを使うと、LINEなどにシェアできます。');return;}try{if(navigator.share)await navigator.share({title:'ガチャSTOP!',text:'ガチャの使いすぎをチェックできるよ！',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('URLをコピーしたよ！LINEに貼り付けて送ってね。');}}catch(e){}});
if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));render();
</script></body></html>
